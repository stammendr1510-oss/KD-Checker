name: Tests

on:
  push:
    branches: ['feat/**', 'feature/**']
  pull_request:
    branches: [main, 'feat/**', 'feature/**']
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded pushes to the same PR, never jobs belonging to other PRs.
# The latest commit still receives full Windows + Linux coverage.
concurrency:
  group: tests-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.13 tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Check dependency policy
        run: python tools/dependency_policy.py

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Install Chromium for UI regression tests
        run: python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest -q
